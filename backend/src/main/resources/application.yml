spring:
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  datasource:
    url: jdbc:h2:file:./campus_activity;MODE=MySQL;DATABASE_TO_LOWER=TRUE;WRITE_DELAY=0
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
app:
  images:
    directory: ${APP_IMAGE_DIR:./uploads/images}
  avatars:
    directory: ${APP_AVATAR_DIR:./uploads/avatars}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  checkin:
    token-secret: ${CHECKIN_TOKEN_SECRET:}
  amap:
    js-key: ${AMAP_JS_KEY:}
    security-js-code: ${AMAP_SECURITY_JS_CODE:}
    web-service-key: ${AMAP_WEB_SERVICE_KEY:}
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-flash}

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
